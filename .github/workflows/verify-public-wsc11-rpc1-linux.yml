name: Public WSC11 RPC1 Linux pair

on:
  push:
    branches: [codex/verify-public-wsc11-rpc1-linux-20261126]

permissions:
  contents: read

concurrency:
  group: public-wsc11-rpc1-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-public-pair:
    if: >-
      github.repository == 'HitGameAI/apex-rpc-gateway' &&
      github.repository_id == '1445014240' &&
      github.actor == 'FJ-Tony' && github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/verify-public-wsc11-rpc1-linux-20261126' &&
      github.run_attempt == 1 && github.event.created == true &&
      github.event.deleted == false && github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read diagnostic controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
          sparse-checkout: .handover-public-wsc-rpc-pair
      - name: Read exact public WSC candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: HitGameAI/apex-wsc
          ref: d1e7c62a7b560176007c67aa0ff04679d2727267
          path: wsc
          persist-credentials: false
      - name: Read exact public RPC merge preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: HitGameAI/apex-rpc-gateway
          ref: 4469574177ce1520f805667e621d6bbe2ac6b216
          path: rpc
          persist-credentials: false
      - name: Fixed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false
      - name: Prepare public dependencies and diagnostic modfile
        run: python3 -I -B controls/.handover-public-wsc-rpc-pair/proof.py prepare "$GITHUB_WORKSPACE" "/tmp/public-wsc-rpc-pair-$GITHUB_RUN_ID-1"
      - name: Run original tests in an offline unprivileged namespace
        shell: bash
        run: |
          set -euo pipefail
          scratch="/tmp/public-wsc-rpc-pair-$GITHUB_RUN_ID-1"
          sudo -n chown -R 65534:65534 "$scratch"
          sudo -n /usr/bin/unshare --net -- /bin/bash -eu -c '
            /usr/sbin/ip link set lo up
            exec /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups --no-new-privs --bounding-set=-all \
              /usr/bin/env -i PATH=/usr/bin:/bin PUBLIC_PAIR_SCRATCH="$1" \
              /usr/bin/python3 -I -B "$1/controls/proof.py" run "$1/sources" "$1"
          ' public-pair "$scratch"
      - name: Remove public staged sources and caches
        if: always()
        run: >-
          sudo -n /usr/bin/env GITHUB_RUN_ID="$GITHUB_RUN_ID" /usr/bin/python3 -I -B
          controls/.handover-public-wsc-rpc-pair/proof.py cleanup
          "$GITHUB_WORKSPACE" "/tmp/public-wsc-rpc-pair-$GITHUB_RUN_ID-1"
      - name: Upload JSON metadata only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: public-wsc11-rpc1-linux-1.25.0
          path: /tmp/public-wsc-rpc-pair-${{ github.run_id }}-1-json/*.json
          if-no-files-found: error
          retention-days: 7
